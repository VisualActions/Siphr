<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siphr — Redesign Proposal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #050706; }
    body { font-family: "IBM Plex Sans", -apple-system, system-ui, sans-serif; color: #ebe9dc; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="screens/Landing.jsx"></script>
  <script type="text/babel" src="screens/KeyCeremony.jsx"></script>
  <script type="text/babel" src="screens/Repo.jsx"></script>
  <script type="text/babel" src="screens/Transparency.jsx"></script>
  <script type="text/babel" src="screens/Dashboard.jsx"></script>
  <script type="text/babel" src="screens/Featured.jsx"></script>
  <script type="text/babel" src="screens/Admin.jsx"></script>
  <script type="text/babel" src="screens/CreateRepo.jsx"></script>
  <script type="text/babel" src="screens/QuickSetup.jsx"></script>
  <script type="text/babel" src="screens/Roadmap.jsx"></script>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    function App() {
      return (
        <DesignCanvas
          title="Siphr — Redesign Proposal"
          subtitle="Cryptographic-native UX · dark instrument + light variant · v0.3"
        >
          <DCSection
            id="landing"
            title="01 · Marketing"
            subtitle="Make Siphr instantly feel different from GitHub"
          >
            <DCArtboard id="landing-dark" label="Landing · dark" width={1280} height={2600}>
              <ScreenLanding theme="dark" />
            </DCArtboard>
            <DCArtboard id="landing-light" label="Landing · light" width={1280} height={2600}>
              <ScreenLanding theme="light" />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="onboarding"
            title="02 · Onboarding"
            subtitle="Signup as a moment of consequence — the moment that defines trust"
          >
            <DCArtboard id="keygen-dark" label="Key Ceremony · dark" width={1280} height={1120}>
              <ScreenKeyCeremony theme="dark" />
            </DCArtboard>
            <DCArtboard id="keygen-light" label="Key Ceremony · light" width={1280} height={1120}>
              <ScreenKeyCeremony theme="light" />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="repo"
            title="03 · Repo page"
            subtitle="Encryption rendered as a visual primitive — not just a yellow badge"
          >
            <DCArtboard id="repo-dark" label="Private repo · dark" width={1280} height={1280}>
              <ScreenRepo theme="dark" />
            </DCArtboard>
            <DCArtboard id="repo-light" label="Private repo · light" width={1280} height={1280}>
              <ScreenRepo theme="light" />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="dashboard"
            title="04 · Dashboard"
            subtitle="Make session-aware E2EE feel tangible"
          >
            <DCArtboard id="dashboard-dark" label="Dashboard · dark" width={1280} height={1180}>
              <ScreenDashboard theme="dark" />
            </DCArtboard>
            <DCArtboard id="dashboard-light" label="Dashboard · light" width={1280} height={1180}>
              <ScreenDashboard theme="light" />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="transparency"
            title="05 · Verify, don't trust"
            subtitle="New page · turns the privacy claim into something checkable"
          >
            <DCArtboard id="transparency-dark" label="Transparency · dark" width={1280} height={1920}>
              <ScreenTransparency theme="dark" />
            </DCArtboard>
            <DCArtboard id="transparency-light" label="Transparency · light" width={1280} height={1920}>
              <ScreenTransparency theme="light" />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="featured"
            title="06 · Featured projects"
            subtitle="Landmark codebases that needed a second forge — even when their canonical home is GitHub"
          >
            <DCArtboard id="featured-dark" label="Featured · dark" width={1280} height={1900}>
              <ScreenFeatured theme="dark" />
            </DCArtboard>
            <DCArtboard id="featured-light" label="Featured · light" width={1280} height={1900}>
              <ScreenFeatured theme="light" />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="admin"
            title="07 · Operator console"
            subtitle="Internal admin page — dramatizing what operators can and emphatically can't see"
          >
            <DCArtboard id="admin-dark" label="Operator · dark" width={1280} height={1600}>
              <ScreenAdmin theme="dark" />
            </DCArtboard>
            <DCArtboard id="admin-light" label="Operator · light" width={1280} height={1600}>
              <ScreenAdmin theme="light" />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="create"
            title="08 · Create a repo"
            subtitle="GitHub-shaped form, reframed around encryption — wrap-to-keys, what-the-server-sees preview"
          >
            <DCArtboard id="create-dark" label="Create repo · dark" width={1280} height={1480}>
              <ScreenCreateRepo theme="dark" />
            </DCArtboard>
            <DCArtboard id="create-light" label="Create repo · light" width={1280} height={1480}>
              <ScreenCreateRepo theme="light" />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="setup"
            title="09 · Quick setup"
            subtitle="Empty-repo page — four paths into an encrypted repo, honest about which are real today"
          >
            <DCArtboard id="setup-dark" label="Quick setup · dark" width={1280} height={1880}>
              <ScreenQuickSetup theme="dark" />
            </DCArtboard>
            <DCArtboard id="setup-light" label="Quick setup · light" width={1280} height={1880}>
              <ScreenQuickSetup theme="light" />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="roadmap"
            title="10 · Roadmap"
            subtitle="Grounded in the actual repo — what's built, what's next, what's deliberately not planned"
          >
            <DCArtboard id="roadmap-dark" label="Roadmap · dark" width={1280} height={4220}>
              <ScreenRoadmap theme="dark" />
            </DCArtboard>
            <DCArtboard id="roadmap-light" label="Roadmap · light" width={1280} height={4220}>
              <ScreenRoadmap theme="light" />
            </DCArtboard>
          </DCSection>

          <DCPostIt x={40} y={40} width={300}>
            <strong>v3 — dark + light.</strong><br/><br/>
            Every screen now ships both modes side-by-side. The settings popover in the top-right of each artboard shows the appearance toggle in its checked state — that's how a user would switch.<br/><br/>
            Note: the topnav and "server" / "terminal" surfaces (box 3, ciphertext panels, transparency log) stay dark in both modes by design. The wall doesn't flip.
          </DCPostIt>
        </DesignCanvas>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
