<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siphr — Redesign Proposal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #1a1814; }
    body { font-family: "Inter", -apple-system, system-ui, sans-serif; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#f4f0e6">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#f4f0e6"/>
      <!-- copper sigil tile -->
      <g transform="translate(420 240)">
        <rect width="360" height="360" rx="24" fill="#b25927"/>
        <g fill="#fffdf7">
          <rect x="40"  y="40"  width="56" height="56" rx="4"/>
          <rect x="152" y="40"  width="56" height="56" rx="4"/>
          <rect x="264" y="40"  width="56" height="56" rx="4"/>
          <rect x="96"  y="152" width="56" height="56" rx="4"/>
          <rect x="208" y="152" width="56" height="56" rx="4"/>
          <rect x="40"  y="264" width="56" height="56" rx="4"/>
          <rect x="264" y="264" width="56" height="56" rx="4"/>
        </g>
      </g>
      <!-- wordmark -->
      <text x="600" y="680" text-anchor="middle" font-family="Instrument Serif, Times New Roman, serif" font-size="68" fill="#1a1814" font-style="italic">siphr</text>
      <text x="600" y="720" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#1a1814" opacity="0.55" letter-spacing="4">REDESIGN · LOADING</text>
    </svg>
  </template>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="screens/Landing.jsx"></script>
  <script type="text/babel" src="screens/KeyCeremony.jsx"></script>
  <script type="text/babel" src="screens/Repo.jsx"></script>
  <script type="text/babel" src="screens/Transparency.jsx"></script>
  <script type="text/babel" src="screens/Dashboard.jsx"></script>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    function App() {
      return (
        <DesignCanvas
          title="Siphr — Redesign Proposal"
          subtitle="Cryptographic-native UX · paper + ink · v0.1"
        >
          <DCSection
            id="landing"
            title="01 · Marketing"
            subtitle="Make Siphr instantly feel different from GitHub"
          >
            <DCArtboard id="landing-1" label="Landing · long-form" width={1280} height={2600}>
              <ScreenLanding />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="onboarding"
            title="02 · Onboarding"
            subtitle="Signup as a moment of consequence — the moment that defines trust"
          >
            <DCArtboard id="keygen" label="Key Ceremony · step 2 of 4" width={1280} height={1120}>
              <ScreenKeyCeremony />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="repo"
            title="03 · Repo page"
            subtitle="Encryption rendered as a visual primitive — not just a yellow badge"
          >
            <DCArtboard id="repo-1" label="Private repo · decrypted view" width={1280} height={1280}>
              <ScreenRepo />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="dashboard"
            title="04 · Dashboard"
            subtitle="Make session-aware E2EE feel tangible"
          >
            <DCArtboard id="dashboard-1" label="Dashboard · logged-in" width={1280} height={1180}>
              <ScreenDashboard />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="transparency"
            title="05 · Verify, don't trust"
            subtitle="New page · turns the privacy claim into something checkable"
          >
            <DCArtboard id="transparency-1" label="Transparency · verifiable artifacts" width={1280} height={1920}>
              <ScreenTransparency />
            </DCArtboard>
          </DCSection>

          <DCPostIt x={40} y={40} width={280}>
            <strong>What this is.</strong><br/><br/>
            5 reimagined screens that lean into Siphr's actual identity (cryptographic-native, anti-corporate, verifiable) instead of looking like GitHub-with-a-green-checkmark.<br/><br/>
            Visual system: warm paper · deep ink · copper accent · editorial serif + mono. Repeating motifs: ciphertext bytes, fingerprint sigils, "what the server actually sees" reveals.
          </DCPostIt>
        </DesignCanvas>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
